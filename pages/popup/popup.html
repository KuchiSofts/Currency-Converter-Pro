<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter Pro</title>
  <link rel="stylesheet" href="../../styles/themes.css?version=3.3.0">
  <link rel="stylesheet" href="../../styles/popup.css?version=3.3.0">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo">
        <img src="../../icons/icon-48.png" alt="Currency Converter" class="logo-icon" />
        <h1>Currency Converter</h1>
      </div>
      <button id="settingsBtn" class="settings-btn" title="Settings">
        <span>⚙️</span>
      </button>
    </div>

    <div class="converter-section">
      <div class="input-group">
        <label for="fromAmount">Amount</label>
        <div class="amount-input-wrapper">
          <input type="number" id="fromAmount" placeholder="0.00" step="0.01" min="0">
          <select id="fromCurrency" class="currency-select">
            <optgroup label="Popular">
              <option value="USD">$ USD</option>
              <option value="EUR">€ EUR</option>
              <option value="GBP">£ GBP</option>
              <option value="JPY">¥ JPY</option>
              <option value="ILS">₪ ILS</option>
              <option value="CAD">C$ CAD</option>
              <option value="AUD">A$ AUD</option>
              <option value="CHF">₣ CHF</option>
            </optgroup>
            <optgroup label="Americas">
              <option value="BRL">R$ BRL - Brazilian Real</option>
              <option value="MXN">$ MXN - Mexican Peso</option>
              <option value="ARS">$ ARS - Argentine Peso</option>
              <option value="CLP">$ CLP - Chilean Peso</option>
              <option value="COP">$ COP - Colombian Peso</option>
              <option value="PEN">S/ PEN - Peruvian Sol</option>
              <option value="UYU">$ UYU - Uruguayan Peso</option>
            </optgroup>
            <optgroup label="Asia">
              <option value="CNY">¥ CNY - Chinese Yuan</option>
              <option value="INR">₹ INR - Indian Rupee</option>
              <option value="KRW">₩ KRW - South Korean Won</option>
              <option value="HKD">HK$ HKD - Hong Kong Dollar</option>
              <option value="SGD">S$ SGD - Singapore Dollar</option>
              <option value="THB">฿ THB - Thai Baht</option>
              <option value="MYR">RM MYR - Malaysian Ringgit</option>
              <option value="IDR">Rp IDR - Indonesian Rupiah</option>
              <option value="PHP">₱ PHP - Philippine Peso</option>
              <option value="VND">₫ VND - Vietnamese Dong</option>
              <option value="TWD">NT$ TWD - Taiwan Dollar</option>
              <option value="PKR">₨ PKR - Pakistani Rupee</option>
              <option value="BDT">৳ BDT - Bangladeshi Taka</option>
            </optgroup>
            <optgroup label="Europe">
              <option value="CZK">Kč CZK - Czech Koruna</option>
              <option value="DKK">kr DKK - Danish Krone</option>
              <option value="HUF">Ft HUF - Hungarian Forint</option>
              <option value="NOK">kr NOK - Norwegian Krone</option>
              <option value="PLN">zł PLN - Polish Zloty</option>
              <option value="RUB">₽ RUB - Russian Ruble</option>
              <option value="SEK">kr SEK - Swedish Krona</option>
              <option value="TRY">₺ TRY - Turkish Lira</option>
              <option value="UAH">₴ UAH - Ukrainian Hryvnia</option>
              <option value="RON">lei RON - Romanian Leu</option>
              <option value="ISK">kr ISK - Icelandic Krona</option>
              <option value="BGN">лв BGN - Bulgarian Lev</option>
              <option value="HRK">kn HRK - Croatian Kuna</option>
              <option value="ALL">L ALL - Albanian Lek</option>
            </optgroup>
            <optgroup label="Middle East">
              <option value="AED">د.إ AED - UAE Dirham</option>
              <option value="SAR">﷼ SAR - Saudi Riyal</option>
              <option value="QAR">﷼ QAR - Qatari Riyal</option>
              <option value="KWD">د.ك KWD - Kuwaiti Dinar</option>
              <option value="BHD">د.ب BHD - Bahraini Dinar</option>
              <option value="OMR">﷼ OMR - Omani Rial</option>
              <option value="JOD">د.ا JOD - Jordanian Dinar</option>
            </optgroup>
            <optgroup label="Africa">
              <option value="ZAR">R ZAR - South African Rand</option>
              <option value="EGP">£ EGP - Egyptian Pound</option>
              <option value="NGN">₦ NGN - Nigerian Naira</option>
              <option value="KES">KSh KES - Kenyan Shilling</option>
              <option value="GHS">₵ GHS - Ghanaian Cedi</option>
              <option value="MAD">د.م. MAD - Moroccan Dirham</option>
            </optgroup>
            <optgroup label="Oceania">
              <option value="NZD">NZ$ NZD - New Zealand Dollar</option>
            </optgroup>
            <optgroup label="Cryptocurrencies">
              <option value="BTC">₿ BTC - Bitcoin</option>
              <option value="ETH">Ξ ETH - Ethereum</option>
              <option value="USDT">₮ USDT - Tether</option>
              <option value="USDC">USDC - USD Coin</option>
              <option value="BNB">BNB - Binance Coin</option>
              <option value="XRP">XRP - Ripple</option>
              <option value="ADA">ADA - Cardano</option>
              <option value="SOL">SOL - Solana</option>
              <option value="DOGE">Ð DOGE - Dogecoin</option>
              <option value="DOT">DOT - Polkadot</option>
              <option value="MATIC">MATIC - Polygon</option>
              <option value="LTC">Ł LTC - Litecoin</option>
            </optgroup>
          </select>
        </div>
      </div>

      <div class="swap-container">
        <button id="swapBtn" class="swap-btn" title="Swap currencies">
          <span>⇅</span>
        </button>
      </div>

      <div class="input-group">
        <label for="toAmount">Converted Amount</label>
        <div class="amount-input-wrapper">
          <input type="number" id="toAmount" placeholder="0.00" readonly>
          <select id="toCurrency" class="currency-select">
            <optgroup label="Popular">
              <option value="ILS">₪ ILS</option>
              <option value="USD">$ USD</option>
              <option value="EUR">€ EUR</option>
              <option value="GBP">£ GBP</option>
              <option value="JPY">¥ JPY</option>
              <option value="CAD">C$ CAD</option>
              <option value="AUD">A$ AUD</option>
              <option value="CHF">₣ CHF</option>
            </optgroup>
            <optgroup label="Americas">
              <option value="BRL">R$ BRL - Brazilian Real</option>
              <option value="MXN">$ MXN - Mexican Peso</option>
              <option value="ARS">$ ARS - Argentine Peso</option>
              <option value="CLP">$ CLP - Chilean Peso</option>
              <option value="COP">$ COP - Colombian Peso</option>
              <option value="PEN">S/ PEN - Peruvian Sol</option>
              <option value="UYU">$ UYU - Uruguayan Peso</option>
            </optgroup>
            <optgroup label="Asia">
              <option value="CNY">¥ CNY - Chinese Yuan</option>
              <option value="INR">₹ INR - Indian Rupee</option>
              <option value="KRW">₩ KRW - South Korean Won</option>
              <option value="HKD">HK$ HKD - Hong Kong Dollar</option>
              <option value="SGD">S$ SGD - Singapore Dollar</option>
              <option value="THB">฿ THB - Thai Baht</option>
              <option value="MYR">RM MYR - Malaysian Ringgit</option>
              <option value="IDR">Rp IDR - Indonesian Rupiah</option>
              <option value="PHP">₱ PHP - Philippine Peso</option>
              <option value="VND">₫ VND - Vietnamese Dong</option>
              <option value="TWD">NT$ TWD - Taiwan Dollar</option>
              <option value="PKR">₨ PKR - Pakistani Rupee</option>
              <option value="BDT">৳ BDT - Bangladeshi Taka</option>
            </optgroup>
            <optgroup label="Europe">
              <option value="CZK">Kč CZK - Czech Koruna</option>
              <option value="DKK">kr DKK - Danish Krone</option>
              <option value="HUF">Ft HUF - Hungarian Forint</option>
              <option value="NOK">kr NOK - Norwegian Krone</option>
              <option value="PLN">zł PLN - Polish Zloty</option>
              <option value="RUB">₽ RUB - Russian Ruble</option>
              <option value="SEK">kr SEK - Swedish Krona</option>
              <option value="TRY">₺ TRY - Turkish Lira</option>
              <option value="UAH">₴ UAH - Ukrainian Hryvnia</option>
              <option value="RON">lei RON - Romanian Leu</option>
              <option value="ISK">kr ISK - Icelandic Krona</option>
              <option value="BGN">лв BGN - Bulgarian Lev</option>
              <option value="HRK">kn HRK - Croatian Kuna</option>
              <option value="ALL">L ALL - Albanian Lek</option>
            </optgroup>
            <optgroup label="Middle East">
              <option value="AED">د.إ AED - UAE Dirham</option>
              <option value="SAR">﷼ SAR - Saudi Riyal</option>
              <option value="QAR">﷼ QAR - Qatari Riyal</option>
              <option value="KWD">د.ك KWD - Kuwaiti Dinar</option>
              <option value="BHD">د.ب BHD - Bahraini Dinar</option>
              <option value="OMR">﷼ OMR - Omani Rial</option>
              <option value="JOD">د.ا JOD - Jordanian Dinar</option>
            </optgroup>
            <optgroup label="Africa">
              <option value="ZAR">R ZAR - South African Rand</option>
              <option value="EGP">£ EGP - Egyptian Pound</option>
              <option value="NGN">₦ NGN - Nigerian Naira</option>
              <option value="KES">KSh KES - Kenyan Shilling</option>
              <option value="GHS">₵ GHS - Ghanaian Cedi</option>
              <option value="MAD">د.م. MAD - Moroccan Dirham</option>
            </optgroup>
            <optgroup label="Oceania">
              <option value="NZD">NZ$ NZD - New Zealand Dollar</option>
            </optgroup>
            <optgroup label="Cryptocurrencies">
              <option value="BTC">₿ BTC - Bitcoin</option>
              <option value="ETH">Ξ ETH - Ethereum</option>
              <option value="USDT">₮ USDT - Tether</option>
              <option value="USDC">USDC - USD Coin</option>
              <option value="BNB">BNB - Binance Coin</option>
              <option value="XRP">XRP - Ripple</option>
              <option value="ADA">ADA - Cardano</option>
              <option value="SOL">SOL - Solana</option>
              <option value="DOGE">Ð DOGE - Dogecoin</option>
              <option value="DOT">DOT - Polkadot</option>
              <option value="MATIC">MATIC - Polygon</option>
              <option value="LTC">Ł LTC - Litecoin</option>
            </optgroup>
          </select>
        </div>
      </div>
    </div>

    <div class="rate-info" id="rateInfo">
      <span class="rate-text"></span>
      <span class="last-updated"></span>
    </div>

    <div class="attribution" id="attribution">
      <a id="rateAttributionLink" href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates By Exchange Rate API</a>
      <span aria-hidden="true">·</span>
      <a href="https://www.coingecko.com" target="_blank" rel="noopener">Crypto prices powered by CoinGecko</a>
    </div>

    <div class="stats-bar" id="statsBar" data-section="statsBar" style="display: none;">
      <div class="stat-item">
        <span class="stat-label">Status:</span>
        <span class="stat-value" id="activeStatus">Checking...</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Updated:</span>
        <span class="stat-value" id="lastUpdate">Loading...</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Theme:</span>
        <span class="stat-value" id="currentTheme">Default</span>
      </div>
    </div>

    <div class="favorites-section" id="favoritesSection" data-section="favorites" style="display: none;">
      <div class="section-header">
        <h3>Quick Convert</h3>
        <button id="editFavoritesBtn" class="text-btn" title="Edit favorites">
          <span>✏️</span>
        </button>
      </div>
      <div id="favoritesGrid" class="favorites-grid"></div>
    </div>

    <div class="actions" id="actionsSection" data-section="actions" style="display: none;">
      <button id="refreshBtn" class="btn-icon" title="Refresh rates">
        <span class="btn-icon-symbol">🔄</span>
        <span class="btn-text">Refresh</span>
      </button>
      <button id="copyBtn" class="btn-icon" title="Copy result">
        <span class="btn-icon-symbol">📋</span>
        <span class="btn-text">Copy</span>
      </button>
      <button id="historyBtn" class="btn-icon" title="View history">
        <span class="btn-icon-symbol">📜</span>
        <span class="btn-text">History</span>
      </button>
      <button id="compareBtn" class="btn-icon" title="Compare rates">
        <span class="btn-icon-symbol">📊</span>
        <span class="btn-text">Compare</span>
      </button>
    </div>

    <div class="quick-toggles" id="quickTogglesSection" data-section="quickToggles" style="display: none;">
      <div class="toggle-item">
        <input type="checkbox" id="quickToggleTooltip" class="toggle-checkbox">
        <label for="quickToggleTooltip">Tooltips</label>
      </div>
      <div class="toggle-item">
        <input type="checkbox" id="quickToggleHighlight" class="toggle-checkbox">
        <label for="quickToggleHighlight">Highlight</label>
      </div>
      <div class="toggle-item">
        <input type="checkbox" id="quickToggleReplace" class="toggle-checkbox">
        <label for="quickToggleReplace">Replace Prices</label>
      </div>
    </div>

    <div class="footer-links" id="footerLinksSection" data-section="footerLinks" style="display: none;">
      <button id="fullSettingsBtn" class="footer-link">⚙️ Full Settings</button>
      <button id="helpBtn" class="footer-link">❓ Help</button>
    </div>

  </div>

  <script src="../../lib/themes.js?version=3.3.0"></script>
  <script src="popup.js?version=3.3.0"></script>
</body>
</html>
